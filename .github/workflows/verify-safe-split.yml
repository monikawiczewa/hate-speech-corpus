name: Verify leakage-safe corpus split
on:
  push:
    paths:
      - 'scripts/*.py'
      - 'clean/Dataset_*.txt'
      - 'AUDIT_FINDINGS.md'
      - 'CORRECTED_SPLIT.md'
      - 'reports/*.json'
      - 'tests/test_safe_split.py'
      - '.github/workflows/verify-safe-split.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Run full corrected split and assert zero normalized duplicate overlap
        run: python scripts/safe_split.py --input clean --output split_data_corrected --seed 42
      - name: Independently verify saved full-corpus splits
        run: python scripts/verify_split.py --input clean --output split_data_corrected
      - name: Reproduce full output with the same seed
        run: |
          python scripts/safe_split.py --input clean --output split_data_repeat --seed 42 > /dev/null
          cmp split_data_corrected/train.csv split_data_repeat/train.csv
          cmp split_data_corrected/val.csv split_data_repeat/val.csv
          cmp split_data_corrected/test.csv split_data_repeat/test.csv
          cmp split_data_corrected/audit.json split_data_repeat/audit.json
      - name: Check committed aggregate reports
        run: |
          cmp reports/audit.json split_data_corrected/audit.json
          cmp reports/verification.json split_data_corrected/verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: corrected-split-audit
          path: |
            split_data_corrected/audit.json
            split_data_corrected/verification.json
          if-no-files-found: error
          retention-days: 30
