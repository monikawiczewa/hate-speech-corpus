name: Verify leakage-safe corpus split
on:
  push:
    paths:
      - 'scripts/safe_split.py'
      - 'tests/test_safe_split.py'
      - '.github/workflows/verify-safe-split.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Run full corrected split and assert zero normalized duplicate overlap
        run: python scripts/safe_split.py --input clean --output split_data_corrected --seed 42
      - name: Verify report and record counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('split_data_corrected/audit.json').read_text())
          assert a['normalized_text_overlap_between_splits']==0
          assert sum(a['before_oversampling'].values())==a['input_records']
          assert a['after_oversampling']['val']==a['before_oversampling']['val']
          assert a['after_oversampling']['test']==a['before_oversampling']['test']
          print(json.dumps(a,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: corrected-split-audit
          path: split_data_corrected/audit.json
          retention-days: 30
